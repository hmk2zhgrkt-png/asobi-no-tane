name: Venue priors regression
on:
  push:
    paths:
      - 'boat-ai/runtime/venue_context.py'
      - 'boat-ai/runtime/test_venue_context.py'
      - '.github/workflows/venue-context-test.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate venue table and probability adjustment
        run: python boat-ai/runtime/test_venue_context.py
