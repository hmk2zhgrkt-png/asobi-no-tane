name: Independent BOAT RACE Elo 3-year chronological validation
on:
  push:
    paths:
      - '.github/workflows/boat-own-elo.yml'
      - 'boat-ai/runtime/own_elo.py'
      - 'boat-ai/runtime/evaluate_own_elo.py'
      - 'boat-ai/runtime/test_own_elo.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat-own-elo-research
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn joblib
      - name: Verify Elo rules and zero information leakage
        run: |
          python -m py_compile boat-ai/runtime/own_elo.py boat-ai/runtime/evaluate_own_elo.py
          python boat-ai/runtime/test_own_elo.py
          python boat-ai/runtime/test_train_course_3y.py
      - name: Verify all 36 historic months and run Elo ablation
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python boat-ai/runtime/course_history_manifest.py
          python boat-ai/runtime/evaluate_own_elo.py
      - name: Preserve independent research evaluation and trained artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boat-ai/runtime/course_training_3y/own_elo_evaluation.json
          git add boat-ai/runtime/course_training_3y/own_elo_research_only.joblib
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Archive own-Elo research training and unseen 3-year holdout metrics'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve research artifacts as workflow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: own-elo-three-year-validated-model
          path: |
            boat-ai/runtime/course_training_3y/own_elo_evaluation.json
            boat-ai/runtime/course_training_3y/own_elo_research_only.joblib
          retention-days: 30
          if-no-files-found: warn
