name: Boat AI - fetch historical pre-race snapshots
on:
  push:
    paths:
      - '.github/workflows/boat-ai-backfill.yml'
  workflow_dispatch:
    inputs:
      start:
        description: First date (YYYY-MM-DD)
        required: true
        default: '2025-11-01'
        type: string
      end:
        description: Last date (YYYY-MM-DD)
        required: true
        default: '2026-10-31'
        type: string
  # No schedule until the historical backfill has been reviewed.
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect source CSVs with audit
        run: python boat-ai/collect_missing.py --start "${{ inputs.start }}" --end "${{ inputs.end }}" --workers 5 --out backfill.zip
      - name: Retain source files and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-previews
          path: backfill.zip
          if-no-files-found: warn
          retention-days: 30
