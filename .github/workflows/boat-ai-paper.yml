name: Boat AI model smoke check and paper prediction
on:
  push:
    paths:
      - 'boat-ai/runtime/model_bundle.zip'
      - 'boat-ai/runtime/generate_smoke_input.py'
      - '.github/workflows/boat-ai-paper.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'synthetic-smoke (infrastructure only), historical-demo, or live'
        required: true
        type: choice
        options:
          - synthetic-smoke
          - historical-demo
          - live
      input_folder:
        description: 'Repository folder with entries.csv and odds.csv'
        required: true
        default: boat-ai/runtime/input
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy lightgbm scikit-learn joblib
      - name: Verify trained bundle is actually present and intact
        shell: bash
        run: |
          test -f boat-ai/runtime/model_bundle.zip || { echo "BLOCKED: User must upload original ZIP to boat-ai/runtime/model_bundle.zip"; exit 1; }
          echo "9edf35ceaed65514ab8fdc08042f8c4462f4663e5e0ee17dcec7a16b5fd7c22d  boat-ai/runtime/model_bundle.zip" | sha256sum -c -
          mkdir -p boat-ai/runtime/model
          python -m zipfile -e boat-ai/runtime/model_bundle.zip boat-ai/runtime/model
          test -f boat-ai/runtime/model/with_motor_rank1.joblib
          test -f boat-ai/runtime/model/with_motor_rank2.joblib
          test -f boat-ai/runtime/model/with_motor_rank3.joblib
          test -f boat-ai/runtime/model/学習検証結果.json
      - name: Smoke test model inference and paper ledger
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
          INPUT_FOLDER: ${{ github.event.inputs.input_folder }}
        run: |
          MODE="${REQUESTED_MODE:-synthetic-smoke}"
          if [ "$MODE" = "synthetic-smoke" ]; then
            echo "SMOKE TEST ONLY: SYNTHETIC INPUT, NOT A RACE RESULT"
            mkdir -p boat-ai/runtime/input
            python boat-ai/runtime/generate_smoke_input.py
            INPUT_FOLDER="boat-ai/runtime/input"
            MODE="historical-demo"
          fi
          INPUT_FOLDER="${INPUT_FOLDER:-boat-ai/runtime/input}"
          case "$INPUT_FOLDER" in
            boat-ai/runtime/input|boat-ai/runtime/input/*) ;;
            *) echo "Unexpected input folder"; exit 1 ;;
          esac
          python boat-ai/runtime/run_one.py \
            --entries "$INPUT_FOLDER/entries.csv" \
            --odds "$INPUT_FOLDER/odds.csv" \
            --mode "$MODE" \
            --out boat-ai/runtime/output
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path('boat-ai/runtime/output/predictions_120.csv')
          df=pd.read_csv(p)
          assert len(df)==120, f'Expected 120 combinations, found {len(df)}'
          assert abs(df.probability.sum()-1)<1e-6, 'Probability sum not equal to 1'
          assert Path('boat-ai/runtime/output/manifest.json').exists()
          print('PASS: 120 predictions, probability sum=1, run manifest')
          PY
      - name: Downloadable results (paper trades only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-ai-paper-results
          path: boat-ai/runtime/output/
          if-no-files-found: warn
          retention-days: 30
