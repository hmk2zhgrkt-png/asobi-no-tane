name: Boat AI fast screenshot inference smoke test
on:
  push:
    paths:
      - 'boat-ai/runtime/auto_predict.py'
      - 'boat-ai/runtime/source_fetch.py'
      - '.github/workflows/boat-ai-fast-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile speed-optimized script
        run: python -m py_compile boat-ai/runtime/auto_predict.py
      - name: Install prediction dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy lightgbm scikit-learn joblib
      - name: Extract known incumbent model
        run: |
          echo '9edf35ceaed65514ab8fdc08042f8c4462f4663e5e0ee17dcec7a16b5fd7c22d  boat-ai/runtime/model_bundle.zip' | sha256sum -c -
          mkdir -p boat-ai/runtime/model
          python -m zipfile -e boat-ai/runtime/model_bundle.zip boat-ai/runtime/model
      - name: Regression test latest saved real race without stale official websites
        run: |
          python boat-ai/runtime/test_exhibition_f_bonus.py
          python - <<'PY'
          import csv,json,sys
          from pathlib import Path
          sys.path.insert(0,'boat-ai/runtime')
          from exhibition_f_bonus import adjust_combo_probs,details
          root=Path('boat-ai/runtime/latest_results')
          report=json.loads((root/'report.json').read_text(encoding='utf-8'))
          with (root/'features6.csv').open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          with (root/'predictions120.csv').open(encoding='utf-8-sig',newline='') as f:
              picks=list(csv.DictReader(f))
          assert report.get('model_ran') and len(rows)==6 and len(picks)==120
          assert all(str(x['date'])==report['date'] and str(x['race'])==str(report['race']) and
                     x['venue']==report['venue'] for x in rows)
          rates=[float(x['exhibition_st']) for x in rows]
          combo=[x['trifecta'] for x in picks]
          original=[float(x.get('pre_exhibition_f_bonus_probability',x['probability'])) for x in picks]
          adjusted=adjust_combo_probs(combo,original,rates)
          assert abs(sum(adjusted)-1)<1e-10
          assert details(rates)['no_bets']
          print('ARCHIVED_REAL_RACE_F_SMOKE_PASS',report['venue'],report['race'],details(rates)['positive_exhibition_boats'])
          PY
      - name: Preserve one-shot inference and execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokuyama12r-fast-verified
          path: boat-ai/runtime/fast_smoke_results/
          retention-days: 30
          if-no-files-found: warn
