name: Race source fallback regression
on:
  push:
    paths:
      - 'boat-ai/runtime/source_fetch.py'
      - 'boat-ai/runtime/auto_predict.py'
      - 'boat-ai/runtime/test_source_fetch.py'
      - 'boat-ai/runtime/screenshot_input.py'
      - 'boat-ai/runtime/test_screenshot_input.py'
      - '.github/workflows/boat-source-test.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate fallback syntax and fail-closed logic
        run: |
          python -m py_compile boat-ai/runtime/source_fetch.py boat-ai/runtime/auto_predict.py boat-ai/runtime/screenshot_input.py
          python boat-ai/runtime/test_screenshot_input.py
          python boat-ai/runtime/test_source_fetch.py
      - name: Verify actual official racer, preview, and motor period
        run: |
          python - <<'PY'
          from datetime import datetime
          import sys
          sys.path.insert(0,'boat-ai/runtime')
          from source_fetch import fetch_official_card,official_txt,parse_official_preview,official_motor_cycle
          date='2026-11-15';venue=24;race=8
          card=fetch_official_card(date,venue,race)
          assert card['レースコード']=='202611152408'
          assert [card[f'艇{i}_登録番号'] for i in range(1,3)]==['4934','4114']
          stamp=datetime.fromisoformat('2026-11-15T18:27:00+09:00')
          tkz=parse_official_preview(official_txt('tkz',date,venue,race),'tkz',date,venue,race,'18:33',stamp)
          stt=parse_official_preview(official_txt('stt',date,venue,race),'stt',date,venue,race,'18:33',stamp)
          assert len([tkz[f'艇{i}_展示タイム'] for i in range(1,7)])==6
          assert sorted(int(stt[f'艇{i}_コース']) for i in range(1,7))==list(range(1,7))
          assert len([stt[f'艇{i}_スタート展示'] for i in range(1,7)])==6
          assert official_motor_cycle(date,venue)=='2026-05-24'
          print('OFFICIAL_FALLBACK_PASS: card, 6 exhibitions, 6 courses, 6 start ST, motor generation')
          PY
