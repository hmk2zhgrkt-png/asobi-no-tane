name: Race source fallback regression
on:
  push:
    paths:
      - 'boat-ai/runtime/source_fetch.py'
      - 'boat-ai/runtime/auto_predict.py'
      - 'boat-ai/runtime/test_source_fetch.py'
      - '.github/workflows/boat-source-test.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check fallback and model syntax
        run: |
          python -m py_compile boat-ai/runtime/source_fetch.py boat-ai/runtime/auto_predict.py
          python boat-ai/runtime/test_source_fetch.py
      - name: Verify real upstream padded race card conversion
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'boat-ai/runtime')
          from source_fetch import fetch_official_card
          c=fetch_official_card('2026-11-15',24,8)
          assert c['レースコード']=='202611152408'
          assert c['艇1_登録番号']=='4934'
          assert c['艇2_登録番号']=='4114'
          assert len({c[f'艇{i}_登録番号'] for i in range(1,7)})==6
          for i in range(1,7):
              assert c[f'艇{i}_モーター番号']
              assert c[f'艇{i}_全国勝率']
          print('OFFICIAL_CONVERT_OK:',c['レースコード'],
                [(c[f'艇{i}_選手名'],c[f'艇{i}_モーター番号']) for i in range(1,7)])
          PY
