name: Race source fallback regression
on:
  push:
    paths:
      - 'boat-ai/runtime/source_fetch.py'
      - 'boat-ai/runtime/auto_predict.py'
      - 'boat-ai/runtime/test_source_fetch.py'
      - '.github/workflows/boat-source-test.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source fallback and production inference syntax
        run: |
          python -m py_compile boat-ai/runtime/source_fetch.py boat-ai/runtime/auto_predict.py
          python boat-ai/runtime/test_source_fetch.py
      - name: Probe current upstream availability without modifying prediction results
        run: |
          python - <<'PY'
          import datetime as dt, sys
          from zoneinfo import ZoneInfo
          sys.path.insert(0,'boat-ai/runtime')
          from source_fetch import fetch_csv, check_upstream_card
          date=dt.datetime.now(ZoneInfo('Asia/Tokyo')).date()
          for kind in ('programs/race_cards','previews/tkz'):
              try:
                  data,origin=fetch_csv(kind,date)
                  print(kind,'OK',len(data),'origin',origin)
              except Exception as e:
                  print(kind,'UNAVAILABLE',str(e)[:450])
          print('Boatcast upstream:',check_upstream_card(date,24,8))
          PY
      - name: Probe official BOAT RACE race-page endpoints
        run: |
          python - <<'PY'
          from urllib.request import urlopen, Request
          from urllib.error import HTTPError, URLError
          urls=[
              'https://www.boatrace.jp/owpc/pc/race/racelist?rno=8&jcd=24&hd=20261115',
              'https://www.boatrace.jp/owpc/pc/race/beforeinfo?rno=8&jcd=24&hd=20261115',
              'https://race.boatcast.jp/api_txt/getHoldingList2_20261115.json',
              'https://www.boatrace.jp/owpc/pc/race/odds3t?rno=8&jcd=24&hd=20261115',
          ]
          for u in urls:
              try:
                  with urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=7) as r:
                      body=r.read()
                  print('PROBE',u,'OK_BYTES',len(body),'HTML',b'<html' in body.lower())
              except Exception as e:
                  print('PROBE',u,type(e).__name__,getattr(e,'code',str(e)[:100]))
          PY
      - name: Probe Boatcast official data filename variants
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen,Request
          from urllib.error import HTTPError, URLError
          variants=[
              'https://race.boatcast.jp/hp_txt/24/bc_j_str3_20261115_24_8.txt',
              'https://race.boatcast.jp/hp_txt/24/bc_j_str3_20261115_24_08.txt',
              'https://race.boatcast.jp/hp_txt/24/bc_j_str3_20261115_24_03.txt',
              'https://race.boatcast.jp/hp_txt/24/bc_j_str3_20261115_24_3.txt',
          ]
          for u in variants:
              try:
                  with urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=4) as r:
                      b=r.read()
                  print('VARIANT',u,'AVAILABLE',len(b),'prefix',repr(b[:90]))
              except Exception as e:
                  print('VARIANT',u,type(e).__name__,getattr(e,'code',str(e)[:70]))
          u='https://race.boatcast.jp/api_txt/getHoldingList2_20261115.json'
          try:
              with urlopen(Request(u),timeout=5) as r: data=json.load(r)
              print('HOLDING_JSON',repr(str(data)[:800]))
          except Exception as e:print('HOLDING_JSON ERROR',repr(str(e)))
          PY
      - name: Inspect official Boatcast TSV race card fields
        run: |
          python - <<'PY'
          from urllib.request import urlopen,Request
          u='https://race.boatcast.jp/hp_txt/24/bc_j_str3_20261115_24_08.txt'
          with urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=6) as r:
              lines=r.read().decode('utf-8-sig').splitlines()
          print('OFFICIAL_TSV_LINES',len(lines))
          for line in lines[:4]:
              fields=line.split('\\t')
              print('OFFICIAL_TSV_SAMPLE',len(fields),repr(fields[:26]),'last',repr(fields[26:]))
          PY
      - name: Validate direct official six-boat card conversion
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'boat-ai/runtime')
          from source_fetch import fetch_official_card
          card=fetch_official_card('2026-11-15',24,8)
          assert card['レースコード']=='202611152408'
          assert card['艇1_登録番号']=='4934'
          assert card['艇2_登録番号']=='4114'
          for i in range(1,7):
              assert card[f'艇{i}_モーター番号']
              assert card[f'艇{i}_全国勝率']
          print('OFFICIAL_CONVERT_OK',card['レースコード'],
                [(card[f'艇{i}_選手名'],card[f'艇{i}_モーター番号']) for i in range(1,7)])
          PY
