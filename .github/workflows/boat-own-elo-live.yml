name: Score live race with independent 3-year Elo (research)
on:
  push:
    paths:
      - 'boat-ai/runtime/score_own_elo_live.py'
      - 'boat-ai/runtime/score_conditional_live.py'
      - 'boat-ai/runtime/archive_research.py'
      - '.github/workflows/boat-own-elo-live.yml'
      - 'boat-ai/runtime/request.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fast Elo model dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn joblib
      - name: Score live race using all strictly earlier dates
        run: |
          python boat-ai/runtime/score_own_elo_live.py
          python - <<'PY'
          import json,datetime
          from pathlib import Path
          r=json.loads(Path('boat-ai/runtime/latest_results/own_elo_research.json').read_text())
          assert len(r['top5'])==5 and abs(r['sum_probability']-1)<1e-9
          assert r['historic_last_date'] < r['date']
          assert r['base_28feature_model_unchanged'] and r['no_bets']
          print('ELO_LIVE_PASS',json.dumps(r['top5'],ensure_ascii=False))
          PY
      - name: Score conditional second-and-third model and experimental 28-feature blend
        run: |
          python boat-ai/runtime/score_conditional_live.py
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('boat-ai/runtime/latest_results/conditional_elo_research.json').read_text())
          assert obj['production_changed'] is False
          assert obj['automatic_live_betting_allowed'] is False
          for row in obj['models'].values():
              assert len(row['all120'])==120
              assert abs(sum(row['all120'].values())-1)<1e-8
              assert len(row['top5'])==5
          print('CONDITIONAL_ELO_SIDE_BY_SIDE_PASS',obj['date'],obj['venue'],obj['race'])
          PY
      - name: Preserve research-score time and all 120 combinations separately
        run: python boat-ai/runtime/archive_research.py
      - name: Save race-specific experimental Elo predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boat-ai/runtime/latest_results/own_elo_research.json boat-ai/runtime/latest_results/conditional_elo_research.json boat-ai/runtime/preclose_archive/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Archive preclose own-Elo research TOP5 for requested race'
          git pull --rebase origin main
          git push origin HEAD:main
