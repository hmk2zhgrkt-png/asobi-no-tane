name: Conditional second/third place model + Elo + heldout calibration
on:
  push:
    paths:
      - 'boat-ai/runtime/conditional_roles_3y.py'
      - 'boat-ai/runtime/test_conditional_roles_3y.py'
      - '.github/workflows/boat-conditional-roles.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat-conditional-roles-training
  cancel-in-progress: false
jobs:
  conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn joblib
      - name: Unit test leakage-safe sequential scoring and 120-way normalisation
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          python -m py_compile boat-ai/runtime/conditional_roles_3y.py
          python boat-ai/runtime/test_conditional_roles_3y.py
      - name: Audit historical source integrity
        run: python boat-ai/runtime/course_history_manifest.py
      - name: Train and validate conditional position models with own Elo
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python boat-ai/runtime/conditional_roles_3y.py
      - name: Save reports and research-only model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boat-ai/runtime/course_training_3y/conditional_roles_evaluation.json boat-ai/runtime/course_training_3y/conditional_roles_research_only.joblib
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record strict holdout conditional 2nd/3rd model with own Elo and validation-picked calibration'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Keep experimental artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conditional-roles-heldout-elo-research
          path: |
            boat-ai/runtime/course_training_3y/conditional_roles_evaluation.json
            boat-ai/runtime/course_training_3y/conditional_roles_research_only.joblib
          retention-days: 30
          if-no-files-found: warn
