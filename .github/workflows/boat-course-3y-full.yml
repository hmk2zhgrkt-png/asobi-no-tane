name: Three-year historical course archive (36 monthly jobs)
on:
  push:
    paths:
      - '.github/workflows/boat-course-3y-full.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat-course-3y-full
  cancel-in-progress: false
jobs:
  fetch-month:
    name: Official course history ${{ matrix.month }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        month: ['2023-11', '2023-12', '2024-01', '2024-02', '2024-03', '2024-04', '2024-05', '2024-06', '2024-07', '2024-08', '2024-09', '2024-10', '2024-11', '2024-12', '2025-01', '2025-02', '2025-03', '2025-04', '2025-05', '2025-06', '2025-07', '2025-08', '2025-09', '2025-10', '2025-11', '2025-12', '2026-01', '2026-02', '2026-03', '2026-04', '2026-05', '2026-06', '2026-07', '2026-08', '2026-09', '2026-10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official K-result decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          python -m pip install --disable-pip-version-check boatrace-lzh
      - name: Collect official race course and finish labels
        id: collect
        continue-on-error: true
        run: |
          python boat-ai/runtime/collect_course_month.py --month "${{ matrix.month }}" --out boat-ai/runtime/course_history_3y
      - name: Preserve every month's data and missing-day audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-history-${{ matrix.month }}
          path: boat-ai/runtime/course_history_3y/
          if-no-files-found: warn
          retention-days: 30
  assemble:
    needs: fetch-month
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all monthly checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: course-history-*
          merge-multiple: true
          path: boat-ai/runtime/course_history_3y
      - name: Validate archive and missing-day coverage
        run: |
          python boat-ai/runtime/course_history_manifest.py
      - name: Commit all verified monthly source archives and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boat-ai/runtime/course_history_3y/
          if git diff --cached --quiet; then echo 'Already archived'; exit 0; fi
          git commit -m 'Store three years of monthly official racer course labels'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Backup combined archive
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-course-three-years-all-months
          path: boat-ai/runtime/course_history_3y/
          if-no-files-found: warn
          retention-days: 30
