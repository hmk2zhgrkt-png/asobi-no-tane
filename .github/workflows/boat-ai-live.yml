name: Boat AI - real data inference and paper log
on:
  push:
    paths:
      - 'boat-ai/runtime/request.json'
  workflow_dispatch:
    inputs:
      date:
        description: 'Race date (YYYY-MM-DD, Japan time)'
        required: true
        type: string
      venue:
        description: 'Venue number (01-24)'
        required: true
        type: string
      race:
        description: 'Race number (1-12)'
        required: true
        type: string
  schedule:
    - cron: '30 15 * * *'  # 00:30 JST: settle saved virtual bets
permissions:
  contents: write
concurrency:
  group: boat-ai-public-ledger
  cancel-in-progress: false
jobs:
  score:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy lightgbm scikit-learn joblib
      - name: Extract and validate uploaded model
        run: |
          echo '9edf35ceaed65514ab8fdc08042f8c4462f4663e5e0ee17dcec7a16b5fd7c22d  boat-ai/runtime/model_bundle.zip' | sha256sum -c -
          mkdir -p boat-ai/runtime/model
          python -m zipfile -e boat-ai/runtime/model_bundle.zip boat-ai/runtime/model
      - name: Select requested race
        id: race
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_VENUE: ${{ inputs.venue }}
          INPUT_RACE: ${{ inputs.race }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json,os,datetime as dt
          from pathlib import Path
          if os.getenv('IS_DISPATCH')=='true':
              req=dict(date=os.getenv('INPUT_DATE'),venue=os.getenv('INPUT_VENUE'),race=os.getenv('INPUT_RACE'))
          else:
              req=json.loads(Path('boat-ai/runtime/request.json').read_text())
          date=dt.date.fromisoformat(str(req['date']))
          venue=int(req['venue']);race=int(req['race'])
          if not (1<=venue<=24 and 1<=race<=12):raise ValueError('Venue/race out of range')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'date={date.isoformat()}\nvenue={venue}\nrace={race}\n')
          print(f'Race request: {date} venue {venue:02d} race {race}')
          PY
      - name: Retrieve current public data and score existing model
        env:
          DATE: ${{ steps.race.outputs.date }}
          VENUE: ${{ steps.race.outputs.venue }}
          RACE: ${{ steps.race.outputs.race }}
        run: |
          # Data publisher may lag official race cards; retry until available or max ~10 minutes.
          for attempt in $(seq 1 20); do
            echo "Data retrieval attempt $attempt/20"
            python boat-ai/runtime/auto_predict.py --date "$DATE" --venue "$VENUE" --race "$RACE" --snapshots boat-ai/runtime/data --models boat-ai/runtime/model --out boat-ai/runtime/latest_results
            decision=$(python - <<'PY'
          import json, datetime as dt, os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p=Path('boat-ai/runtime/latest_results/report.json')
          r=json.loads(p.read_text())
          if r.get('model_ran'): print('READY')
          elif dt.date.fromisoformat(os.environ['DATE']) != dt.datetime.now(ZoneInfo('Asia/Tokyo')).date(): print('STOP')
          elif r.get('status')!='DATA_NOT_READY_SKIP': print('STOP')
          else: print('RETRY')
          PY
            )
            if [ "$decision" != "RETRY" ]; then echo "Source check: $decision"; break; fi
            if [ "$attempt" -eq 20 ]; then break; fi
            sleep 30
          done
      - name: Apply 120 percent EV threshold only to preclose paper bets
        run: |
          python boat-ai/runtime/paper_ledger_v2.py --report boat-ai/runtime/latest_results/report.json --candidates boat-ai/runtime/latest_results/paper_candidates.csv --ledger boat-ai/runtime/paper_ledger.csv
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('boat-ai/runtime/latest_results/report.json').read_text())
          if r.get('model_ran'):
              import pandas as pd
              p=pd.read_csv('boat-ai/runtime/latest_results/predictions120.csv')
              assert len(p)==120 and abs(p.probability.sum()-1)<1e-6
              assert len(set(p.trifecta))==120
              print('PASS: 120 model probabilities, source:',r['status'])
          else:
              print('SAFE SKIP:',r.get('reason'))
          PY
      - name: Settle any completed paper races from published payouts
        run: python boat-ai/runtime/paper_ledger_v2.py --settle --ledger boat-ai/runtime/paper_ledger.csv
      - name: Save model report and immutable paper log back to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boat-ai/runtime/latest_results/
          if test -f boat-ai/runtime/paper_ledger.csv; then git add boat-ai/runtime/paper_ledger.csv; fi
          if git diff --cached --quiet; then echo 'No changed report/ledger'; exit 0; fi
          git commit -m 'Store race AI inference and paper-only decisions'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Downloadable AI result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-ai-latest-inference
          path: boat-ai/runtime/latest_results/
          if-no-files-found: warn
          retention-days: 30
  settle:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pandas/numpy
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Settle pending paper tickets from published payouts
        run: python boat-ai/runtime/paper_ledger_v2.py --settle --ledger boat-ai/runtime/paper_ledger.csv
      - name: Save settlements
        run: |
          if test -f boat-ai/runtime/paper_ledger.csv; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add boat-ai/runtime/paper_ledger.csv
            if git diff --cached --quiet; then echo 'No settlements'; exit 0; fi
            git commit -m 'Settle confirmed paper-only trifecta bets'
            git pull --rebase origin main
            git push origin HEAD:main
          fi