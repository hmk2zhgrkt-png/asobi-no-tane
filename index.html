<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8c26b"><meta name="description" content="1〜6歳向けのおうち遊び110種類。年齢・時間・道具・遊び方で探せる無料の遊び提案アプリ。"><meta property="og:title" content="あそびのタネ｜今日のおうち遊びを見つけよう"><meta property="og:description" content="1〜6歳向けのおうち遊び110種類から、ぴったりの遊びを提案。"><title>あそびのタネ｜おうち遊び110種類</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#283b32;background:#fffaf2;font-size:16px}*{box-sizing:border-box}body{margin:0}main{max-width:590px;margin:auto;padding:20px 16px 64px}.hero{background:linear-gradient(130deg,#fff0bb,#fbd0b3 65%,#f8e5d5);border-radius:28px;padding:28px 24px;position:relative;overflow:hidden}.hero:after{content:"🌼";position:absolute;right:15px;top:16px;font-size:50px;opacity:.7}.hero h1{font-size:2rem;letter-spacing:.02em;margin:0 0 12px}.hero p{margin:0;line-height:1.7;max-width:260px}.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.08em;color:#9a5e2e}.panel,.result{background:#fff;border:1px solid #eee4d6;border-radius:22px;padding:20px;margin-top:18px;box-shadow:0 8px 25px #5e4a2410}.panel h2{font-size:1.15rem;margin:0 0 12px}label{display:block;font-size:.9rem;font-weight:700;margin:12px 0 7px}select,input[type=search]{font:inherit;width:100%;border:1px solid #d6d5c9;background:#fff;border-radius:12px;padding:12px;color:#26392e;min-height:46px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:8px;margin-top:15px;font-weight:600}.check input{width:20px;height:20px;accent-color:#cc7437}button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:12px 16px;min-height:44px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #4d8a64;outline-offset:2px}.primary{width:100%;margin-top:14px;background:#d76e34;color:white;font-size:1.08rem;font-weight:800;box-shadow:0 4px 0 #a9532a}.primary:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}.secondary{background:#eef3e8;color:#304a36;font-weight:700}.reset{background:transparent;color:#875c37;text-decoration:underline;padding:8px 2px}.hint,.muted{font-size:.86rem;color:#62716a;line-height:1.7}.result{background:linear-gradient(155deg,#eaf7df,#f8fbea);border-color:#cbe6c6}.result h2{font-size:1.5rem;margin:10px 0}.result p{line-height:1.8}.tag{color:#476c4e;font-weight:700;font-size:.85rem}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button:last-child{grid-column:1/-1}.favorite-item{display:flex;gap:8px;align-items:center;border-top:1px solid #eceee5;padding:8px 0}.favorite-open{background:#f4f8ef;text-align:left;flex:1}.remove{background:#fff0ed;color:#9e4a39;font-size:.85rem}.hidden{display:none!important}footer{text-align:center;margin-top:24px;font-size:.78rem;line-height:1.8;color:#657168}@media(min-width:460px){.actions{grid-template-columns:1fr 1fr 1fr}.actions button:last-child{grid-column:auto}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main>
<header class="hero"><div class="eyebrow">おうち時間をもっと楽しく</div><h1>🌱 あそびのタネ</h1><p>「今日は何して遊ぼう？」<br>110種類からぴったりの遊びを見つけよう。</p></header>
<section class="panel" aria-label="遊びを探す"><h2>🔎 どんな遊びにする？</h2>
<div class="two"><div><label for="age">年齢</label><select id="age"><option value="1">1歳</option><option value="2">2歳</option><option value="3" selected>3歳</option><option value="4">4歳</option><option value="5">5歳</option><option value="6">6歳</option></select></div><div><label for="minutes">遊べる時間</label><select id="minutes"><option value="5">5分以内</option><option value="15" selected>15分以内</option><option value="30">30分以内</option></select></div></div>
<label for="type">遊び方</label><select id="type"><option value="any">なんでもOK</option><option value="active">🏃 体を動かす</option><option value="quiet">📚 静かに遊ぶ</option><option value="creative">🎨 つくって遊ぶ</option></select>
<label for="gear">道具</label><select id="gear"><option value="any">道具があってもOK</option><option value="none">道具なしだけ</option></select>
<label for="keyword">キーワード検索</label><input id="keyword" type="search" placeholder="例：ぬいぐるみ、絵本、動物">
<label class="check"><input id="cleanup" type="checkbox"> 片付け不要の遊びだけ</label>
<p class="hint" id="matches" aria-live="polite"></p><button class="primary" id="draw">🎲 あそびを見つける</button><button class="reset" id="reset">条件をリセット</button></section>
<section id="result" class="result hidden" aria-live="polite"><div id="details" class="tag"></div><h2 id="title"></h2><p id="description"></p><p id="materials"></p><div class="actions"><button id="favorite" class="secondary">☆ お気に入りに追加</button><button id="share" class="secondary">📤 共有する</button><button id="again" class="secondary">🔄 もう一度</button></div></section>
<section class="panel"><h2>⭐ お気に入り <span class="muted" id="favcount"></span></h2><div id="favorites"></div><p class="hint">タップで遊びを再表示できます。この端末のブラウザに保存されます。</p></section>
<footer>安全のため、必ず大人が見守り、お子さんの発達に合わせて遊んでください。<br>利用者を特定する情報はアプリ内では収集しません。</footer></main>
