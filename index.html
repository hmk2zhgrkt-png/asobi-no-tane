<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4a261"><title>あそびのタネ｜おうち遊びを見つけよう</title><meta name="description" content="1〜6歳のお子さんにぴったりのおうち遊びを、年齢・時間・遊び方から提案します。"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#26352f;background:#fffaf2}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:24px 18px 70px}.hero{background:#ffe4b8;border-radius:24px;padding:26px 22px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:2rem}.hero p{margin:0;line-height:1.7}.panel{background:white;border:1px solid #e9e3d7;border-radius:20px;padding:20px;box-shadow:0 5px 20px #51451c0a}label{display:block;font-weight:700;margin:14px 0 6px}select,button{font:inherit}select{width:100%;padding:12px;border-radius:12px;border:1px solid #c9c6bb;background:#fff}button{border:0;border-radius:14px;padding:14px 18px;cursor:pointer}.primary{width:100%;margin-top:20px;background:#e98239;color:#fff;font-weight:800;font-size:1.1rem}.secondary{background:#f2eee5;color:#34443c}.result{margin-top:20px;padding:22px;background:#e8f5df;border-radius:20px;min-height:140px}.result h2{margin:8px 0}.tag{font-size:.85rem;color:#58665b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions button{flex:1}.hint{font-size:.88rem;color:#59635e;line-height:1.7}.hidden{display:none}footer{text-align:center;color:#6c746d;font-size:.8rem;margin-top:28px}</style></head>
<body><main><header class="hero"><h1>🌱 あそびのタネ</h1><p>「今日は何して遊ぼう？」を、ひとつのタップで。</p></header><section class="panel"><label for="age">お子さんの年齢</label><select id="age"><option value="1">1歳</option><option value="2">2歳</option><option value="3" selected>3歳</option><option value="4">4歳</option><option value="5">5歳</option><option value="6">6歳</option></select><label for="minutes">遊べる時間</label><select id="minutes"><option value="5">5分</option><option value="15" selected>15分</option><option value="30">30分</option></select><label for="type">遊び方</label><select id="type"><option value="any">おまかせ</option><option value="active">体を動かす</option><option value="quiet">静かに遊ぶ</option><option value="creative">つくって遊ぶ</option></select><button id="draw" class="primary">🎲 あそびを見つける</button></section><section id="result" class="result hidden" aria-live="polite"><div class="tag" id="details"></div><h2 id="title"></h2><p id="description"></p><p id="materials"></p><div class="actions"><button id="favorite" class="secondary"></button><button id="again" class="secondary">🔄 もう一度</button></div></section><section class="panel" style="margin-top:20px"><h2>⭐ お気に入り</h2><div id="favorites" class="hint">まだ登録されていません。</div></section><footer>安全のため、必ず大人が見守り、お子さんの発達に合わせて遊んでください。<br>お気に入りはこの端末のブラウザに保存されます。</footer></main><script src="./app.js" defer></script></body></html>
